<style>
/*
VOICE: 차분한 건축 도면, 정보 안내판처럼 명료하게
IDEA: 피난안내도를 깨끗한 벡터 도면으로 다시 그린 층별 시트
PICTURE: 층 탭 아래 실마다 호버 가능한 SVG 평면도, 옆에 실 정보 카드
COLOUR and TYPE: 초록 제목 띠, 흰 평면 + 짙은 초록 선 + 초록 하이라이트, IBM Plex Sans KR
LAYOUT: 층 탭 → 도면(왼쪽) + 정보 패널(오른쪽); 760px 아래에서 세로로 쌓음
*/
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1f15);--ink:light-dark(#12301f,#e6f4ea);--muted:light-dark(#587263,#9cbba8);--line:light-dark(#1d5c3a,#b9e2c8);--hi:#2f9e5e;--hiInk:#ffffff;--panel:light-dark(#f1f8f3,#122a1c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
header{background:#1d6b42;color:#fff;padding:20px max(5vw,16px) 0}
header h1{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.1;font-weight:700;text-wrap:balance}
header h1 b{color:#c8f2d6}
header p{margin:4px 0 14px;opacity:.85;font-size:15px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;font-weight:600;min-width:56px;min-height:44px;display:grid;place-items:center;padding:0 14px;border-radius:8px 8px 0 0;opacity:.75}
nav a:hover{opacity:1;background:#ffffff1a}
nav a.on{background:var(--bg);color:var(--ink);opacity:1}
nav a:focus-visible{outline:3px solid #c8f2d6;outline-offset:-3px}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(16px,3vw,40px);padding:clamp(20px,3vw,40px) max(5vw,16px);max-width:1240px;margin:0 auto;align-items:start}
.plan{position:relative}
svg{width:100%;height:auto;display:block;max-height:80vh}
.wall{fill:none;stroke:var(--line);stroke-width:3;stroke-linejoin:round}
.sp{fill:#ffffff;stroke:var(--line);stroke-width:1.5;cursor:pointer;transition:fill .15s}
.g .sp.c-book{fill:#d3e6fa}.g .sp.c-open{fill:#d4f0db}.g .sp.c-own{fill:#e9e9e6}
.g .sp:hover,.g .sp.on{fill:var(--hi)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 12px;font-size:14px;color:var(--muted);list-style:none;padding:0}
.legend li{display:flex;align-items:center;gap:7px}
.legend i{width:18px;height:14px;border:1.5px solid var(--line);border-radius:3px;display:inline-block}
.sp:focus{outline:none}.sp:focus-visible{stroke:#0f3d24;stroke-width:3}
.lb{font:600 15px "IBM Plex Sans KR",sans-serif;fill:#12301f;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.g.on .lb,.g:hover .lb{fill:var(--hiInk)}
.hole{fill:var(--bg);stroke:none;pointer-events:none}
.nofloor{stroke:#8fcfa5;stroke-width:1.2;fill:none;pointer-events:none}
.lb.hov{opacity:0}.g:hover .lb.hov,.g.on .lb.hov{opacity:1}
.tip{position:absolute;pointer-events:none;background:#14432a;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.4;box-shadow:0 6px 20px #0004;opacity:0;transition:opacity .12s;max-width:260px;z-index:2}
.tip b{display:block;font-size:16px}
.tip.show{opacity:1}
.todo{border:2px dashed var(--line);border-radius:12px;min-height:420px;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.todo strong{display:block;font-size:28px;color:var(--ink);margin-bottom:6px}
aside{background:var(--panel);border-radius:12px;padding:20px 22px;position:sticky;top:16px}
aside h2{margin:0;font-size:32px;line-height:1.1;text-wrap:balance}
aside h2.empty{color:var(--muted)}
aside .use{color:var(--muted);margin:2px 0 14px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
dd{white-space:pre-line}dd a{color:var(--line);font-weight:600}
.book{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:8px;background:var(--hi);color:#fff;font-weight:600;text-decoration:none;margin:14px 0 2px}
.book:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.again{margin:6px 0 0;font-size:14px;color:var(--muted)}
.tip .how{display:block;margin-top:4px;font-size:13px;line-height:1.45;white-space:pre-line;opacity:.92}
.tip i{display:block;font-style:normal;margin-top:4px;color:#c8f2d6;font-size:13px}
.note{font-size:13px;color:var(--muted);margin-top:18px;border-top:1px solid color-mix(in srgb,var(--muted) 30%,transparent);padding-top:12px}
button{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;margin-top:12px}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.list{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.list button{margin:0;min-height:36px;padding:0 10px;font-size:14px;border-width:1px}
.list button.on{background:var(--hi);color:var(--hiInk);border-color:var(--hi)}
@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','||c=='\t'){ row.push(f); f=''; }
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n') i++; row.push(f); f=''; if(row.some(x=>x.trim())) rows.push(row); row=[]; }
    else f+=c;
  }
  row.push(f); if(row.some(x=>x.trim())) rows.push(row);
  const head = rows.shift().map(h=>h.trim());
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()])));
}
let INFO = {};
const KEY_F='층', KEY_ID='공간ID', KEY_NAME='실명', KEY_EN='영문명';
function loadInfo(text, label){
  INFO = {};
  for(const r of parseCSV(text)){
    const f = String(r[KEY_F]||'').replace(/[^0-9]/g,''); const id = r[KEY_ID];
    if(f && id) INFO[f+'-'+id] = r;
  }
  document.getElementById('src').textContent = label;
}

// ── 화면 ─────────────────────────────────────────────────
const svg=document.getElementById('svg'), tip=document.getElementById('tip'), plan=document.getElementById('plan');
const info=document.getElementById('info'), list=document.getElementById('list'), tabs=document.getElementById('tabs');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cen=p=>[p.reduce((a,q)=>a+q[0],0)/p.length, p.reduce((a,q)=>a+q[1],0)/p.length];
const KEY_BOOK='예약처', KEY_HOW='이용방법';
const URL_RE=/(https?:\/\/[^\s,]+)/g, TEL_RE=/(0\d{1,2}-?\d{3,4}-?\d{4})/g;
function rich(v){
  return esc(v).replace(URL_RE,u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'').replace(/\/$/,'')}</a>`)
               .replace(TEL_RE,(t,_,i,str)=>/href="[^"]*$/.test(str.slice(0,i))?t:`<a href="tel:${t.replace(/-/g,'')}">${t}</a>`);
}
const bookLink=id=>((INFO[floor+'-'+id]||{})[KEY_BOOK]||'').match(URL_RE)?.[0]||'';
// 커서 없이 항상 보이는 글자 표시 (예: 출입구). vertical:true면 세로로 쌓음
function txtLabel(s,x,y,fs){
  if(!s.vertical) return `<text class="lb" x="${x}" y="${y}" style="font-size:${fs}px">${esc(s.text)}</text>`;
  const ch=[...s.text], lh=fs*1.15, y0=y-(ch.length-1)*lh/2;
  return `<text class="lb" style="font-size:${fs}px">${ch.map((c,i)=>`<tspan x="${x}" y="${y0+i*lh}">${esc(c)}</tspan>`).join('')}</text>`;
}
// "구분" 칸 → 색. 예약/개방/전용 (1/2/3 숫자로 적어도 됨)
const KEY_CAT='구분';
function catOf(id){ const v=String((INFO[floor+'-'+id]||{})[KEY_CAT]||'').trim();
  if(/^1$|예약/.test(v)) return 'c-book'; if(/^2$|개방|자유|상시/.test(v)) return 'c-open'; if(/^3$|전용|지정/.test(v)) return 'c-own'; return ''; }
const CAT_TEXT={'c-book':'예약 필요','c-open':'예약 없이 이용 가능','c-own':'이용자 지정 (전용)'};
const isNum=id=>/^\d+(-\d+)?$/.test(id);
const numVal=id=>parseFloat(String(id).replace('-','.'));
let floor=5, sel=null, pinned=null;

const rec=id=>INFO[floor+'-'+id]||{};
const spaceOf=id=>(FLOORS[floor]?.spaces||[]).find(s=>s.id===id)||{};
function title(id){ const r=rec(id), n=r[KEY_NAME];
  if(spaceOf(id).hoverName) return n||`${id}호`;   // 호수 대신 이름만 표시하는 실
  return isNum(id) ? (n? `${id}호 ${n}` : `${id}호`) : (n||id); }

tabs.innerHTML = FLOOR_IDS.map(f=>`<a href="#f${f}" data-f="${f}">${f}F</a>`).join('');

function render(){
  const F=FLOORS[floor];
  document.getElementById('fl').textContent=floor+'F';
  tabs.querySelectorAll('a').forEach(a=>{const on=+a.dataset.f===floor; a.classList.toggle('on',on); a.toggleAttribute('aria-current',on)});
  resetPanel();
  const old=plan.querySelector('.todo'); if(old) old.remove();
  if(!F){
    svg.style.display='none'; list.innerHTML=''; document.getElementById('legend').style.display='none';
    plan.insertAdjacentHTML('afterbegin',`<div class="todo"><div><strong>${floor}F 평면도 준비 중</strong>이 층의 피난안내도 사진을 올려주시면 같은 형식으로 그려 넣을게요.</div></div>`);
    return;
  }
  document.getElementById('legend').style.display=''; svg.style.display=''; svg.setAttribute('viewBox',F.viewBox); svg.setAttribute('aria-label',`환경대학원 ${floor}층 평면도`);
  svg.innerHTML = F.spaces.map(s=>{
    const [x,y]=s.label||cen(s.pts);
    const link=bookLink(s.id);
    const g=`<g class="g" data-id="${esc(s.id)}"><polygon class="sp ${catOf(s.id)}"${link?'':' tabindex="0"'} aria-label="${esc(title(s.id))}" points="${s.pts.map(p=>p.join(',')).join(' ')}"/>`+
      (s.hoverName?`<text class="lb hov" x="${x}" y="${y}"${F.labelSize?` style="font-size:${F.labelSize}px"`:''}>${esc(rec(s.id)[KEY_NAME]||s.id)}</text>`:'')+
      (isNum(s.id)&&!s.hoverName?`<text class="lb" x="${x}" y="${y}"${F.labelSize?` style="font-size:${F.labelSize}px"`:''}>${esc(s.id)}</text>`:'')+
      (s.id==='void'&&s.pts.length===4?`<path class="nofloor" d="M${s.pts[0]}L${s.pts[2]}M${s.pts[1]}L${s.pts[3]}"/>`:'')+   // 중정: 바닥 없음 X 표시
      (s.text?txtLabel(s,x,y,F.labelSize||15):'')+`</g>`;
    return link ? `<a href="${esc(link)}" target="_blank" rel="noopener" aria-label="${esc(title(s.id))} 예약하기">${g}</a>` : g;
  }).join('') + (F.holes||[]).map(h=>`<polygon class="hole" points="${h}"/>`).join('') + [F.walls,...(F.extraWalls||[])].map(w=>`<polyline class="wall" points="${w}" pointer-events="none"/>`).join('');
  list.innerHTML = F.spaces.filter((s,k,arr)=>isNum(s.id)&&arr.findIndex(t=>t.id===s.id)===k).sort((a,b)=>numVal(a.id)-numVal(b.id)).map(s=>`<button type="button" data-id="${esc(s.id)}">${esc(title(s.id))}</button>`).join('');
}
function resetPanel(){
  sel=null; pinned=null;
  const h=info.querySelector('h2'); h.textContent='실을 선택하세요'; h.classList.add('empty');
  info.querySelector('.use').textContent='평면도에서 실을 가리키면 여기에 정보가 표시됩니다.';
  info.querySelector('dl').innerHTML='';
  document.getElementById('bookslot').innerHTML='';
}
function show(id){
  sel=id; const r=rec(id);
  svg.querySelectorAll('.g').forEach(g=>{const on=g.dataset.id===id; g.classList.toggle('on',on); g.querySelector('.sp').classList.toggle('on',on)});
  list.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  const h=info.querySelector('h2'); h.textContent=title(id); h.classList.remove('empty');
  info.querySelector('.use').textContent=r[KEY_EN]||'';
  const skip=new Set([KEY_F,KEY_ID,KEY_EN]);
  const rows=[['층',floor+'F'], ...(isNum(id)?[['호실',id+'호']]:[]), ...Object.entries(r).filter(([k,v])=>!skip.has(k)&&v&&!k.startsWith('#')).map(([k,v])=>k===KEY_CAT&&catOf(id)?[k,CAT_TEXT[catOf(id)]]:[k,v])];
  info.querySelector('dl').innerHTML = rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${rich(v)}</dd>`).join('');
  const book=r[KEY_BOOK]||'', link=(book.match(URL_RE)||[])[0];
  document.getElementById('bookslot').innerHTML = link ? `<a class="book" href="${esc(link)}" target="_blank" rel="noopener">예약하기</a>` : '';
}
function route(){
  const m=/^#f([1-9])$/.exec(location.hash); const f=m?+m[1]:5;
  floor = FLOOR_IDS.includes(f)?f:5; render();
}

list.addEventListener('click',e=>{const b=e.target.closest('button'); if(b){pinned=b.dataset.id; show(pinned);}});
svg.addEventListener('pointermove',e=>{
  const g=e.target.closest('.g'); if(!g){tip.classList.remove('show');return}
  const id=g.dataset.id, r=rec(id);
  tip.innerHTML=`<b>${esc(title(id))}</b>${esc(r[KEY_EN]||'')}${catOf(id)?'<i>'+CAT_TEXT[catOf(id)]+'</i>':''}${r[KEY_HOW]?'<span class="how">'+esc(r[KEY_HOW])+'</span>':''}${bookLink(id)?'<i>클릭하면 예약 페이지로 이동해요</i>':(r[KEY_BOOK]?'<i>예약: '+esc(r[KEY_BOOK])+'</i>':'')}`;
  const b=plan.getBoundingClientRect(); let x=e.clientX-b.left+14, y=e.clientY-b.top+14;
  if(x+270>b.width) x=e.clientX-b.left-270;
  tip.style.left=x+'px'; tip.style.top=y+'px'; tip.classList.add('show');
  if(e.pointerType==='mouse') show(id);
});
svg.addEventListener('pointerleave',()=>{tip.classList.remove('show'); if(pinned) show(pinned);});
// 마우스: 링크가 있으면 바로 이동 / 터치·펜: 첫 번째 탭은 정보, 같은 실을 한 번 더 탭하면 이동
let lastPtr='mouse';
svg.addEventListener('pointerdown',e=>{lastPtr=e.pointerType||'mouse'});
svg.addEventListener('click',e=>{
  const g=e.target.closest('.g'); if(!g) return;
  const id=g.dataset.id, a=e.target.closest('a');
  if(a && lastPtr!=='mouse' && e.detail!==0 && pinned!==id){ e.preventDefault(); }
  pinned=id; show(id);
  if(a && lastPtr!=='mouse' && e.defaultPrevented) document.getElementById('bookslot').insertAdjacentHTML('beforeend','<p class="again">실을 한 번 더 누르면 예약처로 이동해요</p>');
  lastPtr='mouse';
});
svg.addEventListener('focusin',e=>{const g=e.target.closest('.g')||e.target.querySelector?.('.g'); if(g) show(g.dataset.id)});
window.addEventListener('hashchange',route);

document.getElementById('copy').addEventListener('click',async e=>{
  const F=FLOORS[floor]; const btn=e.currentTarget;
  if(!F){btn.textContent='이 층은 아직 도면이 없어요';setTimeout(()=>btn.textContent='평면도 SVG 복사',2000);return}
  const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${F.viewBox}">`+
    F.spaces.map(r=>`<polygon id="room-${r.id}" points="${r.pts.map(p=>p.join(',')).join(' ')}" fill="#fff" stroke="#1d5c3a" stroke-width="1.5"/>`).join('')+
    `<polyline points="${F.walls}" fill="none" stroke="#1d5c3a" stroke-width="3"/></svg>`;
  try{await navigator.clipboard.writeText(s); btn.textContent='복사했습니다'}catch{btn.textContent='복사 실패 — 브라우저에서 허용 필요'}
  setTimeout(()=>btn.textContent='평면도 SVG 복사',2000);
});

loadInfo(document.getElementById('fallback').textContent.trim(),'실 정보: 페이지에 내장된 예비 데이터');
route();
fetch('rooms.csv',{cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{
  loadInfo(t,'실 정보: rooms.csv'); const keep=pinned||sel; render(); if(keep){pinned=keep; show(keep);}
}).catch(()=>{});
}
</script>
</body>
